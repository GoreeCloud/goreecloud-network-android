name: build release

on:
  release:
    types: [published]

permissions:
  contents: write
  # Needed to read the run counts the version code is derived from.
  actions: read

concurrency:
  group: android-version-code-lock
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    environment: android-release
    env:
      GOREECLOUD_NETWORK_UPLOAD_KEY_ALIAS: ${{ secrets.GOREECLOUD_NETWORK_UPLOAD_KEY_ALIAS }}
      GOREECLOUD_NETWORK_UPLOAD_KEY_PASSWORD: ${{ secrets.GOREECLOUD_NETWORK_UPLOAD_KEY_PASSWORD }}
      GOREECLOUD_NETWORK_UPLOAD_STORE_PASSWORD: ${{ secrets.GOREECLOUD_NETWORK_UPLOAD_STORE_PASSWORD }}
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      bundle_path: ${{ steps.build.outputs.bundle_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version
        id: version
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          echo "version_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Write release keystore
        run: |
          test -n "${{ secrets.GOREECLOUD_NETWORK_KEYSTORE }}" || { echo "::error::GOREECLOUD_NETWORK_KEYSTORE is not configured"; exit 1; }
          echo "${{ secrets.GOREECLOUD_NETWORK_KEYSTORE }}" | base64 -d > goreecloud-network.keystore
          echo "GOREECLOUD_NETWORK_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/goreecloud-network.keystore" >> "$GITHUB_ENV"

      # Release and snapshot artifacts share one monotonically increasing code
      # sequence so a signed test build can never consume a version code that a
      # later release tries to reuse. The concurrency group above serializes the
      # calculation. This is repository-local release lineage and does not imply
      # publication to any particular app store.
      - name: Compute version code
        id: version_code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count_runs() {
            local runs
            if runs=$(gh api "repos/${{ github.repository }}/actions/workflows/$1/runs?per_page=1" --jq '.total_count' 2>gh_err.txt); then
              if ! [[ "$runs" =~ ^[0-9]+$ ]]; then
                echo "::error::unexpected run count for $1: '$runs'" >&2
                return 1
              fi
              echo "$runs"
            elif grep -q 'HTTP 404' gh_err.txt; then
              echo 0
            else
              echo "::error::failed to fetch run count for $1: $(cat gh_err.txt)" >&2
              return 1
            fi
          }
          release_runs=$(count_runs build-release.yml)
          snapshot_runs=$(count_runs build-snapshot.yml)
          version_code=$((release_runs + snapshot_runs + 40))
          echo "Release runs: $release_runs, snapshot runs: $snapshot_runs -> version_code=$version_code"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build Android
        id: build
        uses: ./.github/actions/build-android
        with:
          version_name: ${{ steps.version.outputs.version_name }}
          version_code: ${{ steps.version_code.outputs.version_code }}
          build_type: release

      - name: Upload files to existing release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.build.outputs.apk_path }}
            ${{ steps.build.outputs.bundle_path }}
          tag_name: ${{ github.event.release.tag_name }}
