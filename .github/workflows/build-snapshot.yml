name: build snapshot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-version-code-lock
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    environment: android-release
    env:
      GOREECLOUD_NETWORK_UPLOAD_KEY_ALIAS: ${{ secrets.GOREECLOUD_NETWORK_UPLOAD_KEY_ALIAS }}
      GOREECLOUD_NETWORK_UPLOAD_KEY_PASSWORD: ${{ secrets.GOREECLOUD_NETWORK_UPLOAD_KEY_PASSWORD }}
      GOREECLOUD_NETWORK_UPLOAD_STORE_PASSWORD: ${{ secrets.GOREECLOUD_NETWORK_UPLOAD_STORE_PASSWORD }}
      GOREECLOUD_NETWORK_SIGNING_CERT_SHA256: ${{ secrets.GOREECLOUD_NETWORK_SIGNING_CERT_SHA256 }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify exact source revision
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$SOURCE_SHA" ]]; then
            echo "Expected source revision $SOURCE_SHA but checked out $actual_sha" >&2
            exit 1
          fi
          echo "Verified exact signed-snapshot source revision: $SOURCE_SHA"

      - name: Get version name
        id: version
        run: |
          SHORT_GIT_SHA=$(git rev-parse --short HEAD)
          echo "version_name=snapshot-${SHORT_GIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Compute version code
        id: version_code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count_runs() {
            local runs
            if runs=$(gh api "repos/${{ github.repository }}/actions/workflows/$1/runs?per_page=1" --jq '.total_count' 2>gh_err.txt); then
              if ! [[ "$runs" =~ ^[0-9]+$ ]]; then
                echo "::error::unexpected run count for $1: '$runs'" >&2
                return 1
              fi
              echo "$runs"
            elif grep -q 'HTTP 404' gh_err.txt; then
              echo 0
            else
              echo "::error::failed to fetch run count for $1: $(cat gh_err.txt)" >&2
              return 1
            fi
          }
          release_runs=$(count_runs build-release.yml)
          snapshot_runs=$(count_runs build-snapshot.yml)
          version_code=$((release_runs + snapshot_runs + 40))
          echo "Release runs: $release_runs, snapshot runs: $snapshot_runs -> version_code=$version_code"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Write release keystore
        run: |
          test -n "${{ secrets.GOREECLOUD_NETWORK_KEYSTORE }}" || { echo "::error::GOREECLOUD_NETWORK_KEYSTORE is not configured"; exit 1; }
          echo "${{ secrets.GOREECLOUD_NETWORK_KEYSTORE }}" | base64 -d > goreecloud-network.keystore
          echo "GOREECLOUD_NETWORK_UPLOAD_STORE_FILE=$GITHUB_WORKSPACE/goreecloud-network.keystore" >> "$GITHUB_ENV"

      - name: Build Android
        id: build
        uses: ./.github/actions/build-android
        with:
          version_name: ${{ steps.version.outputs.version_name }}
          version_code: ${{ steps.version_code.outputs.version_code }}
          build_type: release

      - name: Verify GoreeCloud snapshot APK
        run: bash scripts/verify-goreecloud-artifact.sh "${{ steps.build.outputs.apk_path }}"

      - name: Verify snapshot bundle archive
        run: |
          test -s "${{ steps.build.outputs.bundle_path }}" || { echo "::error::Snapshot bundle is missing or empty"; exit 1; }
          unzip -t "${{ steps.build.outputs.bundle_path }}"
          sha256sum "${{ steps.build.outputs.bundle_path }}"

      - name: Write signed snapshot provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "GOREECLOUD_NETWORK_SOURCE_SHA=$SOURCE_SHA"
            echo "GOREECLOUD_NETWORK_VERSION=${{ steps.version.outputs.version_name }}"
            echo "GOREECLOUD_NETWORK_VERSION_CODE=${{ steps.version_code.outputs.version_code }}"
            sha256sum "${{ steps.build.outputs.apk_path }}"
            sha256sum "${{ steps.build.outputs.bundle_path }}"
          } > goreecloud-network-snapshot-provenance.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.version_name }}-${{ env.SOURCE_SHA }}
          path: |
            ${{ steps.build.outputs.apk_path }}
            ${{ steps.build.outputs.bundle_path }}
            goreecloud-network-snapshot-provenance.txt
          retention-days: 14
